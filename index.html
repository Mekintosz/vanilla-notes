<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Vanila Notes</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap"
      rel="stylesheet"
    />
    <link href="/src/style.css" rel="stylesheet" />
    <style data-purpose="custom-utilities">
      ::-webkit-scrollbar {
        width: 6px;
      }

      ::-webkit-scrollbar-track {
        background: #f1f1f1;
      }

      ::-webkit-scrollbar-thumb {
        background: #c1c1c1;
        border-radius: 3px;
      }

      ::-webkit-scrollbar-thumb:hover {
        background: #a8a8a8;
      }

      .icon-placeholder {
        width: 16px;
        height: 16px;
        object-fit: contain;
        display: inline-block;
        vertical-align: middle;
      }

      .icon-placeholder-lg {
        width: 20px;
        height: 20px;
      }
    </style>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"
      rel="stylesheet"
    />
  </head>

  <body
    class="flex min-h-screen flex-col items-center bg-(--color-gray-bg) font-sans text-(--color-text-dark)"
  >
    <header
      class="z-10 flex h-16 w-full shrink-0 items-center justify-between border-b border-gray-200 bg-white/80 px-6 backdrop-blur-sm lg:px-8"
    >
      <div class="flex items-center gap-3">
        <div
          class="flex h-8 w-8 items-center justify-center rounded-lg bg-(--color-teal-primary)/10"
        >
          <i class="fas fa-leaf text-sm text-(--color-teal-primary)"></i>
        </div>
        <h1 class="text-lg font-bold tracking-tight text-gray-800">
          Vanilla Notes
        </h1>
      </div>
      <div class="flex items-center gap-4">
        <button
          class="flex h-8 w-8 items-center justify-center rounded-full text-gray-400 transition-colors hover:bg-gray-100 hover:text-(--color-teal-primary)"
        >
          <i class="far fa-bell"></i>
        </button>
        <button
          class="flex h-8 w-8 items-center justify-center rounded-full text-gray-400 transition-colors hover:bg-gray-100 hover:text-(--color-teal-primary)"
        >
          <i class="fas fa-cog"></i>
        </button>
        <div
          class="ml-2 flex h-8 w-8 items-center justify-center rounded-full bg-linear-to-br from-(--color-teal-primary) to-cyan-600 text-xs font-bold text-white shadow-sm"
        >
          MM
        </div>
      </div>
    </header>
    <main
      class="flex h-full w-full max-w-[1100px] flex-col gap-6 p-8 lg:flex-row"
    >
      <div
        class="flex w-full shrink-0 flex-col rounded-2xl bg-(--color-gray-bg) p-5 lg:w-[180px]"
        data-purpose="folders-panel"
      >
        <h2 class="mb-4 text-lg font-semibold text-gray-700">Folders</h2>
        <div class="flex flex-col space-y-2">
          <button
            type="button"
            id="all-notes-button"
            class="flex items-center gap-2 rounded-lg p-2 text-left text-sm text-gray-700 transition-colors hover:bg-gray-100"
          >
            <i class="fas fa-folder text-(--color-teal-primary)"></i>
            All Notes
          </button>
          <div
            id="folder-list"
            class="flex flex-col space-y-2 overflow-y-auto"
          ></div>
          <button
            id="new-folder-button"
            class="flex items-center gap-2 rounded-lg p-2 text-sm text-(--color-teal-primary) transition-colors hover:bg-gray-100"
          >
            <i class="fas fa-plus"></i>
            <input
              id="new-folder-input"
              class="w-full border-0 bg-transparent px-0 py-2 text-sm placeholder-(--color-teal-primary) focus:border-(--color-teal-primary) focus:placeholder-transparent"
              placeholder="New Folder"
            />
          </button>
        </div>
      </div>
      <aside
        class="flex w-full shrink-0 flex-col rounded-2xl bg-white p-5 shadow-(--shadow-soft) lg:w-[350px]"
        data-purpose="sidebar"
      >
        <div class="mb-4">
          <button
            id="new-note-button"
            class="flex w-full items-center justify-center gap-2 rounded-lg bg-(--color-teal-primary) px-4 py-3 font-medium text-white shadow-sm transition-colors hover:bg-[#166A88]"
          >
            <i class="fas fa-plus"></i>
            <span>New Note</span>
          </button>
        </div>
        <div class="relative mb-6">
          <div
            class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3"
          >
            <i class="fas fa-search text-gray-400"></i>
          </div>
          <input
            class="w-full rounded-lg border border-gray-300 bg-white py-2 pr-4 pl-10 text-sm text-gray-600 placeholder-gray-400 focus:border-transparent focus:ring-2 focus:ring-(--color-teal-primary) focus:outline-none"
            placeholder="Search"
            type="text"
          />
        </div>
        <div
          id="notes-list"
          class="flex-1 space-y-3 overflow-y-auto pr-1"
        ></div>
      </aside>
      <!-- ---------------------------- No selected note editor screen ---------------------------- -->
      <section
        class="hidden flex-1 flex-col overflow-hidden rounded-2xl bg-white shadow-(--shadow-soft)"
        data-purpose="no-selected-note-screen"
      >
        <div
          class="flex h-full flex-col items-center justify-center p-12 text-center"
        >
          <div
            class="mb-6 flex h-20 w-20 items-center justify-center rounded-full bg-gray-50"
          >
            <i class="far fa-file-alt text-4xl text-gray-300"></i>
          </div>
          <h2 class="mb-3 text-2xl font-semibold text-gray-800">
            Select a note to view
          </h2>
          <p class="mb-8 max-w-sm leading-relaxed text-gray-500">
            Choose a note from the list on the left or create a new one to get
            started.
          </p>
          <button
            id="create-note-button"
            class="flex items-center gap-2 rounded-lg bg-(--color-teal-primary) px-6 py-3 font-medium text-white shadow-sm transition-all hover:bg-[#166A88]"
          >
            <i class="fas fa-plus"></i>
            <span>Create New Note</span>
          </button>
        </div>
      </section>
      <!-- ------------------------- Selected note editor screen ---------------------------- -->
      <section
        id="note-editor"
        class="flex flex-1 flex-col overflow-hidden rounded-2xl bg-white shadow-(--shadow-soft)"
        data-purpose="editor"
      >
        <header
          class="flex items-center justify-between border-b border-gray-100 px-8 py-6"
        >
          <div class="flex items-center gap-3">
            <textarea
              id="note-title"
              class="h-fit w-full appearance-none border-none text-2xl font-semibold tracking-tight text-gray-800 outline-none"
              type="text"
              placeholder="Note Title"
            ></textarea>
          </div>
          <div class="flex flex-col items-end gap-2">
            <button
              id="note-save-button"
              class="rounded-lg bg-(--color-teal-primary) px-5 py-2 text-sm font-medium text-white shadow-sm transition-colors hover:bg-[#166A88]"
            >
              Save
            </button>
            <button
              id="note-delete-button"
              class="flex h-[38px] w-[38px] items-center justify-center rounded-lg border border-gray-200 bg-gray-100 text-gray-600 transition-colors hover:bg-gray-200"
            >
              <i class="far fa-trash-alt text-lg"></i>
            </button>
          </div>
        </header>

        <div class="flex-1 overflow-y-auto p-8" data-purpose="content-area">
          <div class="mx-auto max-w-2xl space-y-6">
            <textarea
              id="note-content"
              class="h-full min-h-[500px] w-full resize-none appearance-none rounded-xl border border-gray-200 p-8 shadow-sm outline-none"
            ></textarea>
          </div>
        </div>
      </section>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
